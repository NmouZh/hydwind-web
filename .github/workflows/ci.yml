name: CI

on:
  push:
    branches:
      - feat/login-gate
      - feat/biography
      - main
  pull_request:
    branches:
      - feat/login-gate
      - feat/biography
      - main
  # 手动触发：验证分支 / 本地修复时无需另开 PR 也能跑完整 CI。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 浏览器冒烟依赖真实 Chromium；playwright-core 只带驱动，需要单独下载。
      # --with-deps 在 Ubuntu runner 上补齐系统库，否则 launch 会缺 lib。
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build

      # 构建产物检查：静态页事实、站内链接，以及 SSR 路由没有误生成静态产物。
      # 单独成步，保证 Build / Check build / Test / Smoke 都真实执行。
      - name: Check build
        run: node ./scripts/check-build.mjs

      - name: Test
        run: npm test

      # API + 浏览器冒烟会真实启动 dist/server/entry.mjs，用临时数据目录覆盖
      # 登录、传记编辑与评论。Chromium 已在上一步装好，浏览器部分不再跳过。
      - name: Smoke
        run: npm run smoke
