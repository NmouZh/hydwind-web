name: CI

on:
  push:
    branches:
      - feat/login-gate
  pull_request:
    branches:
      - feat/login-gate

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: |
          if [ -d test ]; then
            node --test test/
          else
            echo "No test/ directory; skipping tests."
          fi
