name: CI

on:
  push:
    branches:
      - feat/login-gate
      - main
  pull_request:
    branches:
      - feat/login-gate
      - main
  # 手动触发：验证分支 / 本地修复时无需另开 PR 也能跑完整 CI。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # API 冒烟会真实启动 dist/server/entry.mjs，用临时数据目录覆盖
      # /api/health 与 /api/plugin/login/verify 的 200/401/409。
      # Chromium 不可用时只跳过浏览器部分，API 部分仍会执行。
      - name: Smoke
        run: npm run smoke
