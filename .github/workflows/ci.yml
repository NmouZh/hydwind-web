name: CI

on:
  push:
    branches:
      - feat/api-proxy
      - feat/login-gate
      - feat/biography
      - main
  pull_request:
    branches:
      - feat/api-proxy
      - feat/login-gate
      - feat/biography
      - main
  # 手动触发：验证分支 / 本地修复时无需另开 PR 也能跑完整 CI。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 构建产物检查：静态页事实、站内链接，以及 SSR 路由没有误生成静态产物。
      # 单独成步，保证 Build / Check build / Test / Smoke 都真实执行。
      - name: Check build
        run: node ./scripts/check-build.mjs

      - name: Test
        run: npm test

      # 网站只做页面 SSR + /api 反代，不再实现后端接口。
      # 冒烟只检查「后端可达时经网站反代 /api/health」；CI 不启动 hydwind-api，
      # 因此这一步会明确跳过并以 0 退出，不引入跨仓库依赖。
      - name: Smoke
        run: npm run smoke
