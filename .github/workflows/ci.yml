name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'design/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  # 手动触发：验证分支 / 本地修复时无需另开 PR 也能跑完整 CI。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Show toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      # 浏览器冒烟依赖真实 Chromium；playwright-core 只带驱动，需要单独下载。
      # --with-deps 在 Ubuntu runner 上补齐系统库，否则 launch 会缺 lib。
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build

      # 构建产物检查：静态页事实、站内链接，以及 SSR 路由没有误生成静态产物。
      # 单独成步，保证 Build / Check build / Test / Smoke 都真实执行。
      - name: Check build
        run: node ./scripts/check-build.mjs

      - name: Test
        run: npm test

      # API + 浏览器冒烟会真实启动 dist/server/entry.mjs，用临时数据目录覆盖
      # 登录、传记编辑与评论。CI 里浏览器必须真实跑起来，不能静默跳过。
      - name: Smoke
        env:
          REQUIRE_BROWSER: '1'
        run: npm run smoke